name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Same suites twice: PGlite (the zero-setup default) and a real Postgres, where concurrent
  # requests get their own connections and the row locks / SKIP LOCKED are exercised for real.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [pglite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservation_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservation_sync"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://postgres:postgres@localhost:5432/reservation_sync' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
