# Real Postgres, plus the app running against it. `docker compose up --build`, then
# `npm run simulate -- --catalogue` (README). `npm run db:up` starts only the database, for `npm run test:pg`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservation_sync
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation_sync"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/reservation_sync
      DEBUG_ENDPOINTS: "1" # the simulator CLI needs /debug; never set this in a real deploy
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
